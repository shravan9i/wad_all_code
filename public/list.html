
<!DOCTYPE html>
<html>
<head>
  <title>Registered Users</title>
</head>
<body>
  <h1>List of Users</h1>
  <ul id="userList"></ul>

  <script>
    fetch("http://localhost:3000/users")
      .then(res => res.json())
      .then(users => {
        const ul = document.getElementById("userList");
        users.forEach(user => {
          const li = document.createElement("li");
          li.textContent = `${user.name} - ${user.email}`;
          ul.appendChild(li);
        });
      });
  </script>
</body>
</html>
